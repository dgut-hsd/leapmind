[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-image-to-3d-backend"
version = "0.1.0"
description = "FastAPI and Celery backend for an AI image-to-3D pipeline"
requires-python = ">=3.11,<3.13"
dependencies = [
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=1.68,<3",
  "pillow>=11,<13",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "redis>=5,<7",
  "sqlalchemy>=2.0,<3",
  "tenacity>=9,<10",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
background = [
  "rembg[cpu]>=2.0.67,<3",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "pytest-mock>=3.14,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
