version: '3.8'

services:
  landppt:
    image: bradleylzh/landppt:latest
    container_name: landppt
    ports:
      - "8000:8000"
    volumes:
      # Configuration
      - ./.env:/app/.env
      # Data persistence
      - landppt_data:/app/data
      - landppt_uploads:/app/uploads
      - landppt_reports:/app/research_reports
      - landppt_cache:/app/temp
    environment:
      - PYTHONPATH=/app/src
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "./docker-healthcheck.sh"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 40s
    networks:
      - landppt_network

  # M3 薄弱点计算引擎 — 薄弱度计算 / 推荐题目 / 知识图谱 / 增量更新
  m3-engine:
    image: bradleylzh/landppt:latest
    container_name: m3-engine
    ports:
      - "8001:8001"
    volumes:
      # Configuration (使用同一份 .env，包含 DB 连接信息)
      - ./.env:/app/.env
    environment:
      - PYTHONPATH=/app/src:/app/backend:/opt/venv
      - PYTHONUNBUFFERED=1
      - PORT=8001
    command: ["python", "backend/main.py"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - landppt_network

volumes:
  landppt_data:
    driver: local
  landppt_uploads:
    driver: local
  landppt_reports:
    driver: local
  landppt_cache:
    driver: local

networks:
  landppt_network:
    driver: bridge
